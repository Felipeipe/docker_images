
services:
  navdp:
    image: navdp:latest
    build:
      context: ./NavDP
      dockerfile: Dockerfile
    container_name: navdp
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    working_dir: /NavDP/baselines/navdp
    stdin_open: true
    network_mode: host
    tty: true
    gpus: all
    command: python3 navdp_server.py --port 8087 --checkpoint navdp-cross-modal.ckpt
  navdp_bridge:
    image: navdp_bridge:latest
    build:
      context: ./navdp_bridge
      dockerfile: Dockerfile
    container_name: navdp_bridge
    volumes:
      - ../navdp_bridge:/colcon_ws/src/navdp_bridge
    devices: # only for robotless testing
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    network_mode: host
    tty: true
    gpus: all
